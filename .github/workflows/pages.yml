# Publie le site sur GitHub Pages, à https://damoko2004.github.io/portfolio/
#
# C'est l'adresse de référence : les balises canoniques, le sitemap et l'image
# de partage y pointent tous.
#
# Si vous renommez le dépôt, changez BASE_PATH dans src/data/content.ts.

name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  # Rafraîchit les téléchargements CRAN affichés sur la page Publications.
  #
  # GitHub planifie en UTC et ne suit pas l'heure d'été. 23:02 UTC correspond
  # donc à 01:02 à Paris d'avril à octobre, et à 00:02 le reste de l'année.
  # Pour viser 01:02 en hiver, utilisez '2 0 * * *'.
  #
  # Les 2 minutes après l'heure évitent la minute pleine, où GitHub concentre
  # le plus de tâches planifiées et les retarde souvent.
  schedule:
    - cron: '2 23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Relever les téléchargements CRAN
        run: node scripts/fetch-cran-stats.mjs

      - name: Construire le site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
