# Publie une copie du site sur GitHub Pages, sous https://damoko2004.github.io/portfolio/
#
# Netlify reste le site de référence : toutes les pages publiées ici portent une
# balise canonique pointant vers l'adresse Netlify, pour que les moteurs de
# recherche n'indexent qu'une seule version.
#
# Si vous renommez le dépôt, changez PUBLIC_BASE_PATH ci-dessous.

name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Construire pour GitHub Pages
        env:
          PUBLIC_BASE_PATH: /portfolio/
          PUBLIC_SITE_URL: https://damoko2004.github.io
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
